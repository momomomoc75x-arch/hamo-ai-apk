name: Build Hamo AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, dev/local-ai-integration]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Hamo-AI-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hamo-AI-APK
          path: app/build/outputs/apk/debug/Hamo-AI-debug.apk
